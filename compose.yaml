services:
  ontoquery:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8787/api}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
      - "127.0.0.1:${API_PORT:-8787}:8787"
    env_file:
      - .env.production
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8787
      WEB_PORT: 3000
      PLATFORM_DB_PATH: /var/lib/ontoquery/data/platform.sqlite
      ONTOLOGY_WIKI_DIR: /var/lib/ontoquery/wiki
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - ontoquery-data:/var/lib/ontoquery/data
      - ontoquery-wiki:/var/lib/ontoquery/wiki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ontoquery-data:
  ontoquery-wiki:
